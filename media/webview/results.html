<!DOCTYPE html>
<html>
<head>

<style>
  body { margin: 0; padding: 8px 12px; background: var(--vscode-editor-background); color: var(--vscode-editor-foreground);

  .grid { overflow: auto; max-height: 70vh; border: 1px solid var(--vscode-panel-border); border-bottom: 0; overflow-anchor: none; } /* virtual scroll: browser tidak boleh menggeser scroll saat baris diganti */
  table { border-collapse: separate; border-spacing: 0; white-space: nowrap; min-width: 100%; }

  th { position: sticky; top: 0; z-index: 1; height: 34px; font-weight: 600; font-family: var(--vscode-font-family);
    background: var(--vscode-editorGroupHeader-tabsBackground, var(--vscode-editor-background));
    border-right: 1px solid var(--vscode-panel-border); border-bottom: 1px solid var(--vscode-panel-border); }

  tbody tr:hover td { background: var(--vscode-list-hoverBackground); }
  .num { text-align: right; }

  th.n { z-index: 2; background: var(--vscode-editorGroupHeader-tabsBackground, var(--vscode-editor-background)); }
  .null { opacity: .5; }
  /* toolbar WHERE + tombol header + menu kolom */
  .where { display: flex; align-items: center; gap: 6px; margin: 2px 0; font-family: var(--vscode-font-family); }
  .where label { font-size: 11px; font-weight: 600; opacity: .8; }
  .where input { flex: 1; min-width: 0; padding: 2px 8px; font-family: var(--vscode-editor-font-family); font-size: 12px;
    color: var(--vscode-input-foreground); background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border, var(--vscode-panel-border)); border-radius: 2px; }
  .where input:focus { outline: 1px solid var(--vscode-focusBorder); }
  .where .clear, .hb button { border: 0; background: none; color: inherit; cursor: pointer; opacity: .6; padding: 2px; }

  .hd { display: flex; align-items: center; } .hd .lbl { flex: 1; } /* ikon filter / menu selalu di tepi kanan kolom */
  .hb { margin-left: 10px; white-space: nowrap; } .hb button { width: 18px; height: 18px; vertical-align: middle; }
  .hb svg { width: 13px; height: 13px; }
  .menu { position: fixed; z-index: 10; min-width: 190px; padding: 4px 0; overflow: auto; box-sizing: border-box; font-family: var(--vscode-font-family); font-size: 12px;

    border: 1px solid var(--vscode-menu-border, var(--vscode-panel-border)); border-radius: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
  .menu button { display: block; width: 100%; padding: 4px 14px; text-align: left; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  .menu button:hover { background: var(--vscode-menu-selectionBackground, var(--vscode-list-hoverBackground)); }

  /* popup nilai sel (double-click): nilai panjang / JSON ditampilkan penuh */
  .menu.peek { min-width: 240px; max-width: min(640px, 90vw); padding: 8px 10px; }

  /* baris yang akan dihapus saat Save: merah, menang atas warna seleksi */

  tbody.newrows td { background: color-mix(in srgb, var(--vscode-gitDecoration-addedResourceForeground, #81b88b) 12%, transparent); }
  tbody.newrows input.cell { width: 100%; min-width: 60px; }
  tbody td.edited { box-shadow: inset 2px 0 var(--vscode-editorWarning-foreground, #cca700); background: rgba(204, 167, 0, .12) !important; }
  tbody td input.cell { width: 100%; min-width: 80px; box-sizing: border-box; padding: 2px 4px; font: inherit; color: var(--vscode-input-foreground);
    background: var(--vscode-input-background); border: 1px solid var(--vscode-focusBorder); }
  /* baris terpilih: warna dicampur dari focusBorder, bukan list.activeSelectionBackground (ada tema yang warnanya mirip latar grid -> seleksi tidak terlihat) */
  tbody tr.sel td { background: color-mix(in srgb, var(--vscode-focusBorder, #007fd4) 20%, transparent) !important; }
  /* sel aktif (terakhir diklik): biru, di atas warna baris terpilih / Delete rows */
  tbody td.cur, tbody tr.sel td.cur, tbody tr.todelete td.cur { outline: 2px solid var(--vscode-focusBorder, #007fd4); outline-offset: -2px; background: color-mix(in srgb, var(--vscode-focusBorder, #007fd4) 30%, transparent) !important; }
  tbody td { cursor: default; }
  /* nilai panjang (JSON, teks) tidak melebarkan kolom: dipotong dengan ellipsis, nilai penuh lewat double-click / Inspector */
  .cv { display: inline-block; max-width: 420px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  tbody tr.vpad td { padding: 0; height: auto; border: 0; background: none !important; pointer-events: none; }
  /* panel Export (tab rail kanan): cakupan baris + format + Save / Copy */
  #side .xform label { display: block; margin: 10px 0 4px; font-weight: 600; }
  #side .xform select { width: 100%; padding: 4px; font: inherit; color: var(--vscode-dropdown-foreground, inherit);
    background: var(--vscode-dropdown-background, var(--vscode-input-background)); border: 1px solid var(--vscode-dropdown-border, var(--vscode-panel-border)); }
  #side .xform .acts { display: flex; gap: 8px; margin-top: 14px; }
  #side .xform .acts button { flex: 1; text-align: center; padding: 6px; border: 0; border-radius: 2px; cursor: pointer; font: inherit;
    color: var(--vscode-button-secondaryForeground, inherit); background: var(--vscode-button-secondaryBackground, #3a3d41); }
  #side .xform .acts button.primary { color: var(--vscode-button-foreground, #fff); background: var(--vscode-button-background, #0e639c); }
  #side .xform .acts button.primary:hover { background: var(--vscode-button-hoverBackground, #1177bb); }
  #side .xform .acts button.second:hover { background: var(--vscode-button-secondaryHoverBackground, #45494e); }

  /* panel samping: Columns / Inspector (tab vertikal di tepi kanan) */
  .sidetabs { position: fixed; right: 0; top: 40px; display: flex; flex-direction: column; z-index: 5; overflow: hidden; border-radius: 4px 0 0 4px;
    border: 1px solid var(--vscode-panel-border); border-right: 0; background: var(--vscode-editorGroupHeader-tabsBackground, #252526); }
  .sidetabs button { display: inline-flex; align-items: center; gap: 6px; writing-mode: vertical-rl; padding: 12px 5px; border: 0; cursor: pointer;
    font-family: var(--vscode-font-family); font-size: 11px; letter-spacing: .2px;
    color: var(--vscode-foreground, inherit); background: none; opacity: .7; }
  .sidetabs button + button { border-top: 1px solid var(--vscode-panel-border); }
  .sidetabs svg { width: 13px; height: 13px; transform: rotate(90deg); } /* ikon ikut arah teks vertikal */
  .sidetabs button:hover { opacity: 1; background: var(--vscode-list-hoverBackground, #2a2d2e); }
  .sidetabs button.on { opacity: 1; background: var(--vscode-list-activeSelectionBackground, #37373d); box-shadow: inset 2px 0 var(--vscode-focusBorder, #007fd4); }
  body.side-open { padding-right: 300px; } body.side-open .sidetabs { right: 284px; }
  #side { position: fixed; top: 0; right: 0; bottom: 0; width: 284px; z-index: 6; overflow: auto; box-sizing: border-box; padding: 8px 10px;
    font-family: var(--vscode-font-family); font-size: 12px; background: var(--vscode-sideBar-background, var(--vscode-editor-background)); border-left: 1px solid var(--vscode-panel-border); }
  .sidehead { display: flex; align-items: center; margin-bottom: 8px; } .sidehead .sideclose { margin-left: auto; border: 0; background: none; color: inherit; cursor: pointer; font-size: 16px; }
  #sidesrc { margin-bottom: 8px; } #sidesrc:empty { display: none; }
  #sidesrc .srcsel { width: 100%; padding: 3px 4px; font: inherit; color: var(--vscode-dropdown-foreground, inherit);
    background: var(--vscode-dropdown-background, var(--vscode-input-background)); border: 1px solid var(--vscode-dropdown-border, var(--vscode-panel-border)); }
  #side input[type=search] { width: 100%; box-sizing: border-box; padding: 4px 6px; margin-bottom: 6px; font: inherit; color: var(--vscode-input-foreground); background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border, var(--vscode-panel-border)); }
  #side .col { display: flex; align-items: center; gap: 6px; padding: 3px 2px; border-radius: 2px; }
  #side .col:hover { background: var(--vscode-list-hoverBackground); } #side .col a { color: inherit; text-decoration: none; cursor: pointer; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  #side .col .t, #side .kv .t { opacity: .5; font-size: 10px; }
  #side .col { cursor: grab; } #side .col .mv { border: 0; background: none; color: inherit; cursor: pointer; opacity: .5; padding: 0 2px; }
  #side .col .mv:hover { opacity: 1; }
  #side .acts2 { display: flex; gap: 6px; margin-bottom: 6px; } #side .acts2 button { flex: 1; padding: 3px; border: 0; border-radius: 2px; cursor: pointer; font: inherit;
    color: var(--vscode-button-secondaryForeground, inherit); background: var(--vscode-button-secondaryBackground, #3a3d41); }
  #side .kv { padding: 5px 0; border-bottom: 1px solid var(--vscode-panel-border); } #side .kv .k { font-weight: 600; }
  #side .kv .v { margin-top: 2px; font-family: var(--vscode-editor-font-family); white-space: pre-wrap; word-break: break-word; }
  #side .hint { opacity: .6; }
  /* execution plan */
  .planbar { display: flex; align-items: center; gap: 12px; margin: 4px 0 8px; font-family: var(--vscode-font-family); font-size: 12px; }
  .planbar .xmlbtn { margin-left: auto; padding: 2px 10px; border: 0; border-radius: 2px; cursor: pointer; font: inherit;
    color: var(--vscode-button-secondaryForeground, inherit); background: var(--vscode-button-secondaryBackground, #3a3d41); }
  table.plan td.op b { font-weight: 600; } table.plan .lg { opacity: .6; } table.plan .tw { opacity: .4; margin-right: 6px; }
  table.plan td.pct { min-width: 160px; }
  table.plan .track { display: inline-block; width: 90px; height: 10px; vertical-align: middle; border-radius: 2px; background: rgba(128, 128, 128, .15); }
  table.plan .cbar { display: block; height: 100%; border-radius: 2px; background: var(--vscode-charts-blue, #3794ff); }
  table.plan td.hot .cbar { background: var(--vscode-charts-red, #f14c4c); }
  table.plan .v { padding-left: 8px; }
  table.plan td.warn { color: var(--vscode-editorWarning-foreground, #cca700); font-weight: 600; }
  .foot .clock { width: 12px; height: 12px; margin-right: 4px; vertical-align: -2px; }
  .foot { display: flex; gap: 16px; padding: 6px 12px; font-family: var(--vscode-font-family); font-size: 12px; opacity: .8;
    border: 1px solid var(--vscode-panel-border); background: var(--vscode-editorGroupHeader-tabsBackground, var(--vscode-editor-background)); }
  /* Search Output gaya Kibana "is one of": key = chip (OR), cocok di kolom mana pun */

  .rbar { display: flex; align-items: center; gap: 10px; margin: 4px 0; font-family: var(--vscode-font-family); font-size: 12px; }
  .rhead { font-weight: 600; white-space: nowrap; } .rhead .rtitle { font-weight: normal; opacity: .7; }
  /* ikon aksi di header hasil (gaya toolbar): search, Add row, Delete rows, Save, script, Discard */
  .rtools { display: inline-flex; align-items: center; gap: 2px; }
  .rtools button { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 20px; padding: 0; border: 0; border-radius: 3px;
    cursor: pointer; color: inherit; background: none; opacity: .75; }
  .rtools button svg { width: 14px; height: 14px; }
  .rtools button:hover:not(:disabled) { opacity: 1; background: var(--vscode-toolbar-hoverBackground, var(--vscode-list-hoverBackground)); }
  .rtools button.on { opacity: 1; color: var(--vscode-textLink-foreground); background: var(--vscode-toolbar-hoverBackground, var(--vscode-list-hoverBackground)); }
  .rtools .editbar { gap: 2px; } .rtools .editbar::before { content: ''; width: 1px; height: 14px; margin: 0 4px; background: var(--vscode-panel-border); }

  .rtools .editbar .save { color: var(--vscode-charts-blue, #3794ff); }
  .sout { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; margin: 0; font-family: var(--vscode-font-family); font-size: 12px; }
  .sout[hidden] { display: none; } /* class display menang atas [hidden] bawaan browser */

  .sout .chips:focus-within { outline: 1px solid var(--vscode-focusBorder); }

  .sout .skey { flex: 1; min-width: 140px; padding: 2px 4px; border: 0; outline: 0; font-family: var(--vscode-editor-font-family); font-size: 12px;

  .rtitle .cancelload { margin-left: 8px; font-weight: normal; }
  .foot .allbtn { color: var(--vscode-button-foreground, #fff); background: var(--vscode-button-background, #0e639c); }
  .foot .allbtn:disabled { opacity: .5; cursor: progress; }
  .sout .smatch, .sout .sbusy { white-space: nowrap; opacity: .85; }
  .sout .sbusy { color: var(--vscode-editorWarning-foreground, #cca700); } .sbusy button { margin-left: 6px; }
  td.hit { box-shadow: inset 0 -2px var(--vscode-editor-findMatchBorder, #d18616); }
  tbody tr.ph td { opacity: .4; }
  .pager { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .pager .pnum { width: 52px; padding: 0 4px; font: inherit; color: var(--vscode-input-foreground); background: var(--vscode-input-background);
    border: 1px solid var(--vscode-input-border, var(--vscode-panel-border)); }
  .pager select { font: inherit; color: var(--vscode-dropdown-foreground, inherit); background: var(--vscode-dropdown-background, var(--vscode-input-background));
    border: 1px solid var(--vscode-dropdown-border, var(--vscode-panel-border)); }
  .foot { flex-wrap: wrap; align-items: center; }
  .err { color: var(--vscode-errorForeground); white-space: pre-wrap; }
  .msg { white-space: pre-wrap; opacity: .8; }
  /* pemisah antar hasil: Result n / Statement n (rows affected) / pesan */
  .blk + .blk { border-top: 1px solid var(--vscode-panel-border); margin-top: 14px; padding-top: 2px; }
  .aff { padding: 4px 0 6px; opacity: .85; }
  /* loading: spinner tiga cincin di tengah + progress bar tipis di atas, hanya CSS (webview hasil tanpa script) */
  .loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .spin { position: relative; width: 48px; height: 48px; }
  .spin i { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; animation: spin 1.1s cubic-bezier(.5, .1, .5, .9) infinite; }
  .spin i:nth-child(1) { border-top-color: var(--vscode-progressBar-background, #0e70c0); }
  .spin i:nth-child(2) { inset: 7px; border-right-color: var(--vscode-textLink-foreground, #3794ff); animation-duration: 1.6s; animation-direction: reverse; }
  .spin i:nth-child(3) { inset: 14px; border-bottom-color: var(--vscode-charts-green, #89d185); animation-duration: .9s; }
  .label { font-family: var(--vscode-font-family); font-size: 13px; letter-spacing: .3px; }
  .dots b { font-weight: normal; animation: blink 1.2s infinite; }
  .dots b:nth-child(2) { animation-delay: .2s; } .dots b:nth-child(3) { animation-delay: .4s; }
  .sub { font-size: 11px; opacity: .55; }
  .btn { margin-top: 4px; padding: 4px 14px; border-radius: 2px; font-family: var(--vscode-font-family); font-size: 12px; text-decoration: none;
    color: var(--vscode-button-secondaryForeground, #fff); background: var(--vscode-button-secondaryBackground, #3a3d41); }
  .btn:hover { background: var(--vscode-button-secondaryHoverBackground, #45494e); }
  /* run paralel: tiap statement satu section, loading kecil sebaris */
  h2 { font-size: 13px; margin: 0; } h2 span { font-weight: normal; opacity: .7; }
  /* tiap query bisa ditutup / dibuka; chevron kanan = tertutup, diputar ke bawah saat terbuka */
  details.qpart > summary { display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none;
    margin: 16px 0 6px; padding-top: 8px; border-top: 1px solid var(--vscode-panel-border); }
  details.qpart > summary::-webkit-details-marker { display: none; }
  section:first-of-type details.qpart > summary { border-top: 0; padding-top: 0; margin-top: 4px; }
  details.qpart > summary:hover { color: var(--vscode-textLink-foreground); }
  details.qpart > summary .chev { width: 14px; height: 14px; flex: none; opacity: .8; transition: transform .12s; }
  details.qpart[open] > summary .chev { transform: rotate(90deg); }
  .loading.inline { position: static; flex-direction: row; justify-content: flex-start; padding: 10px 4px; }
